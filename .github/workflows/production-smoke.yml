name: Production smoke check

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public Netlify pages and deployed functions
        env:
          SITE_URL: https://mkulim.netlify.app
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, time, urllib.request, urllib.error
          base = os.environ["SITE_URL"].rstrip("/")
          checks = [
            ("/", ["MKULIMA", "AVENQOR HOLDINGS LTD"]),
            ("/subscription.html", ["MKULIMA"]),
            ("/voice-assistant.html", ["Talk to your farm assistant.", "farmPhoto"]),
            ("/robots.txt", ["Sitemap:"]),
            ("/sitemap.xml", ["<urlset"]),
            ("/.netlify/functions/farm-ai", None),
            ("/.netlify/functions/subscription-health", None),
          ]
          failures = []
          for path, markers in checks:
            last = None
            for attempt in range(3):
              try:
                req = urllib.request.Request(base + path, headers={"User-Agent": "MKULIMA-Production-Smoke/1.0"})
                with urllib.request.urlopen(req, timeout=12) as response:
                  status, body = response.status, response.read(1_500_000).decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                status, body = e.code, e.read(1_500_000).decode("utf-8", "replace")
              except Exception as e:
                last = str(e)
                time.sleep(5)
                continue
              last = f"HTTP {status}"
              if path.endswith("/farm-ai"):
                if status in (400, 401, 405, 503): break
              elif path.endswith("/subscription-health"):
                if status in (400, 401, 405, 503): break
              elif status == 200 and (markers is None or all(m in body for m in markers)):
                break
              time.sleep(5)
            else:
              failures.append(f"{path}: {last or 'request failed'}")
              continue
            if path.endswith("/farm-ai") or path.endswith("/subscription-health"):
              if status == 404:
                failures.append(f"{path}: function not found (HTTP 404)")
              elif status >= 500 and status != 503:
                failures.append(f"{path}: server error HTTP {status}")
              else:
                print(f"PASS {path}: function route responds ({status}); authenticated/provider setup is checked separately")
            elif status != 200 or (markers and not all(m in body for m in markers)):
              failures.append(f"{path}: unexpected response {last}; expected markers {markers}")
            else:
              print(f"PASS {path}: HTTP 200")
          if failures:
            raise SystemExit("Production smoke check failed:\n- " + "\n- ".join(failures))
          print("Public deployment smoke check passed. This does not prove payment, database, or AI provider credentials work.")
          PY
