name: Validate MKULIMA
on:
  push:
    branches:
      - main
      - codex/mkulima-mobile-improvements
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  validate:
    name: Check HTML, JavaScript, and core safety notices
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Extract inline JavaScript and check required safeguards
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\\s[^>]*)?>(.*?)</script>", html, flags=re.I | re.S)
          if not scripts:
              raise SystemExit("FAIL: No inline JavaScript found in index.html")
          Path("/tmp/mkulima-inline.js").write_text("\\n;\\n".join(scripts), encoding="utf-8")
          required = [
              "MKULIMA™",
              "AVENQOR HOLDINGS LTD",
              "restoreBackup",
              "image analysis is not connected",
              "todayLocalDate",
              "navigator.serviceWorker.register"
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit("FAIL: Missing required feature/safety text: " + ", ".join(missing))
          print(f"PASS: Found {len(scripts)} inline script(s) and all required safeguards.")
          PY
      - name: Validate JavaScript syntax
        run: node --check /tmp/mkulima-inline.js
