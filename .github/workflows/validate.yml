name: Validate MKULIMA
on:
  push:
    branches:
      - main
      - codex/mkulima-mobile-improvements
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  validate:
    name: Check app code, PWA files, and safety notices
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate manifest and extract inline JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, flags=re.I | re.S)
          if not scripts:
              raise SystemExit("FAIL: No inline JavaScript found in index.html")
          Path("/tmp/mkulima-inline.js").write_text("\n;\n".join(scripts), encoding="utf-8")
          required = [
              "MKULIMA™",
              "AVENQOR HOLDINGS LTD",
              "restoreBackup",
              "image analysis is not connected",
              "todayLocalDate",
              "navigator.serviceWorker.register",
              'rel="manifest"',
              "voiceInputBtn",
              "voiceLanguageDoctor",
              "voiceLanguageAssistant",
              "startMkulimaVoice",
              "assistantVoiceBtn",
              "window.webkitSpeechRecognition",
              "Trusted Kenyan farming resources",
              "https://keep.kalro.org/",
              "https://www.kephis.go.ke/",
              "https://dvs.ecitizen.go.ke/",
              "Could not save this change on this device"
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit("FAIL: Missing required feature/safety text: " + ", ".join(missing))
          manifest = json.loads(Path("manifest.webmanifest").read_text(encoding="utf-8"))
          if manifest.get("name", "").find("MKULIMA") < 0 or manifest.get("start_url") != "/":
              raise SystemExit("FAIL: App manifest name or start URL is invalid")
          if not Path("mkulima-icon.svg").is_file() or not Path("service-worker.js").is_file():
              raise SystemExit("FAIL: App icon or service worker is missing")
          print(f"PASS: {len(scripts)} inline script(s), valid manifest, app icon, service worker, and required safeguards.")
          PY
      - name: Validate inline JavaScript syntax
        run: node --check /tmp/mkulima-inline.js
      - name: Validate service worker JavaScript syntax
        run: node --check service-worker.js
      - name: Validate veterinary examination workspace
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          page = Path("veterinary-examination.html").read_text(encoding="utf-8")
          required = [
              "MKULIMA Veterinary Examination Record",
              "AVENQOR HOLDINGS LTD",
              "Emergency warning signs",
              "qualified veterinary professional",
              "Print / save PDF",
              "Export case as JSON",
              "this page saves records only in this browser",
              "Difficulty breathing",
              "Suspected poison",
              "Diagnosis (clinician only)"
          ]
          missing = [item for item in required if item not in page]
          if missing:
              raise SystemExit("FAIL: Missing veterinary safety or workflow requirement: " + ", ".join(missing))
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", page, flags=re.I | re.S)
          if len(scripts) != 1:
              raise SystemExit("FAIL: Expected one inline script in veterinary examination page")
          Path("/tmp/mkulima-vet-examination.js").write_text("\n;\n".join(scripts), encoding="utf-8")
          if 'href="/veterinary-examination.html"' not in Path("index.html").read_text(encoding="utf-8"):
              raise SystemExit("FAIL: Doctor view does not link to the veterinary examination workspace")
          print("PASS: Veterinary workspace safety content, script extraction, and dashboard link.")
          PY
          node --check /tmp/mkulima-vet-examination.js

      - name: Validate Kenyan farm resource centre
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          page = Path("farm-resource-centre.html").read_text(encoding="utf-8")
          required = [
              "Kenyan Farm Resource Centre",
              "AVENQOR HOLDINGS LTD",
              "https://keep.kalro.org/",
              "https://kalrogaps.info/",
              "https://dvs.ecitizen.go.ke/",
              "https://kephis.go.ke/phytosanitary-services",
              "https://kamis.kilimo.go.ke/",
              "No resources match that search",
              "qualified veterinary professional"
          ]
          missing = [item for item in required if item not in page]
          if missing:
              raise SystemExit("FAIL: Farm resource centre missing requirements: " + ", ".join(missing))
          if 'href="/farm-resource-centre.html"' not in Path("index.html").read_text(encoding="utf-8"):
              raise SystemExit("FAIL: MKULIMA dashboard does not link to farm resource centre")
          import re
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", page, flags=re.I | re.S)
          if len(scripts) != 1:
              raise SystemExit("FAIL: Expected one inline script in resource centre")
          Path("/tmp/mkulima-resource-centre.js").write_text("\n;\n".join(scripts), encoding="utf-8")
          print("PASS: Kenyan resource centre links, safety text, dashboard link and script extraction.")
          PY
          node --check /tmp/mkulima-resource-centre.js

      - name: Validate farm planner and ledger
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          page = Path("farm-planner.html").read_text(encoding="utf-8")
          required = [
              "Farm Planner & Records",
              "AVENQOR HOLDINGS LTD",
              "mkulimaFarmPlanner_v1",
              "Tasks & reminders",
              "Income & expenses",
              "Download backup (JSON)",
              "Validate and restore backup",
              "Records stay on this device",
              "No cloud sync is provided by this page"
          ]
          missing = [item for item in required if item not in page]
          if missing:
              raise SystemExit("FAIL: Farm planner missing requirements: " + ", ".join(missing))
          if 'href="/farm-planner.html"' not in Path("index.html").read_text(encoding="utf-8"):
              raise SystemExit("FAIL: MKULIMA does not link to the farm planner")
          import re
          scripts = re.findall(r"<script(?:\\s[^>]*)?>(.*?)</script>", page, flags=re.I | re.S)
          if len(scripts) != 1:
              raise SystemExit("FAIL: Expected one inline script in farm planner")
          Path("/tmp/mkulima-farm-planner.js").write_text("\n;\n".join(scripts), encoding="utf-8")
          print("PASS: Farm planner records, tasks, ledger, backup, privacy, dashboard link and script extraction.")
          PY
          node --check /tmp/mkulima-farm-planner.js

      - name: Validate M-Pesa instructions and payment safeguards
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          page = Path("payments.html").read_text(encoding="utf-8")
          required = [
              "M-Pesa payment information",
              "303030",
              "2051513056",
              "payment processing is not automated yet".lower(),
              "has not independently verified the payee",
              "Keep your M-Pesa confirmation message",
              "AVENQOR HOLDINGS LTD"
          ]
          lower = page.lower()
          missing = [item for item in required if item.lower() not in lower]
          if missing:
              raise SystemExit("FAIL: Payment page missing required safety/details: " + ", ".join(missing))
          scripts = re.findall(r"<script(?:\\s[^>]*)?>(.*?)</script>", page, flags=re.I | re.S)
          if len(scripts) != 1:
              raise SystemExit("FAIL: Expected one inline script in payment page")
          Path("/tmp/mkulima-payments.js").write_text("\n;\n".join(scripts), encoding="utf-8")
          if 'href="/payments.html"' not in Path("index.html").read_text(encoding="utf-8"):
              raise SystemExit("FAIL: Subscription view does not link to payment instructions")
          print("PASS: M-Pesa details, safety disclaimers, and dashboard link.")
          PY
          node --check /tmp/mkulima-payments.js

      - name: Validate bilingual voice assistant and visual guide
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          checks = {
            "voice-assistant.html": ["Kiswahili", "English", "SpeechRecognition", "SpeechSynthesisUtterance", "Read answer aloud", "rule-based", "DENIS MUTHOMI"],
            "farm-visual-guide.html": ["MAIZE", "CHICKEN", "COW", "not photographs", "mastitis", "fall armyworm"],
          }
          for filename, terms in checks.items():
            page = Path(filename).read_text(encoding="utf-8")
            missing = [term for term in terms if term.lower() not in page.lower()]
            if missing:
              raise SystemExit(f"FAIL: {filename} missing: {missing}")
            scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", page, flags=re.I | re.S)
            if filename == "voice-assistant.html":
              if len(scripts) != 1:
                raise SystemExit("FAIL: expected one voice assistant script")
              Path("/tmp/mkulima-voice.js").write_text("\n;\n".join(scripts), encoding="utf-8")
            elif scripts:
              raise SystemExit("FAIL: visual guide should not require inline scripts")
          if 'href="/voice-assistant.html"' not in Path("index.html").read_text(encoding="utf-8"):
            raise SystemExit("FAIL: dashboard missing voice assistant link")
          if "DENIS MUTHOMI" not in Path("payments.html").read_text(encoding="utf-8"):
            raise SystemExit("FAIL: payment page missing service contact name")
          print("PASS: bilingual voice, visual guide, payment contact and safety notes.")
          PY
          node --check /tmp/mkulima-voice.js

      - name: Validate main dashboard bilingual voice responses
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          page = Path("index.html").read_text(encoding="utf-8")
          required = ["speakLastAnswer", "stopAnswerSpeech", "SpeechSynthesisUtterance", "Inasoma jibu kwa sauti", "TAHADHARI YA DHARURA", "function assistantReply(q)"]
          missing = [x for x in required if x.lower() not in page.lower()]
          if missing:
            raise SystemExit("FAIL: missing main voice feature(s): " + ", ".join(missing))
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", page, flags=re.I | re.S)
          if not scripts:
            raise SystemExit("FAIL: no inline scripts found")
          Path("/tmp/mkulima-index.js").write_text("\n;\n".join(scripts), encoding="utf-8")
          print("PASS: bilingual response content and spoken answer controls.")
          PY
          node --check /tmp/mkulima-index.js

      - name: Validate mobile farm business calculator
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          page = Path("farm-business-calculator.html").read_text(encoding="utf-8")
          required = ["AVENQOR HOLDINGS LTD", "breakEven", "Estimated sales revenue", "Total entered costs", "Estimated balance", "Save estimate on this phone", "not guaranteed profit"]
          missing = [x for x in required if x.lower() not in page.lower()]
          if missing:
            raise SystemExit("FAIL: farm calculator missing: " + ", ".join(missing))
          scripts = re.findall(r"<script(?:\\s[^>]*)?>(.*?)</script>", page, flags=re.I | re.S)
          if len(scripts) != 1:
            raise SystemExit("FAIL: expected one calculator script")
          Path("/tmp/mkulima-farm-business.js").write_text("\\n;\\n".join(scripts), encoding="utf-8")
          dashboard = Path("index.html").read_text(encoding="utf-8")
          if 'href="/farm-business-calculator.html"' not in dashboard:
            raise SystemExit("FAIL: dashboard missing farm calculator link")
          print("PASS: calculator labels, local-save controls and dashboard link.")
          PY
          node --check /tmp/mkulima-farm-business.js

      - name: Validate farm inventory manager
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          page = Path("farm-inventory.html").read_text(encoding="utf-8")
          required = ["Farm Inventory & Stock", "AVENQOR HOLDINGS LTD", "low-stock", "localStorage", "Export CSV", "Download JSON backup", "Restore JSON backup", "does not sync to the cloud"]
          missing = [x for x in required if x.lower() not in page.lower()]
          if missing:
            raise SystemExit("FAIL: farm inventory missing: " + ", ".join(missing))
          scripts = re.findall(r"<script(?:\\s[^>]*)?>(.*?)</script>", page, flags=re.I | re.S)
          if len(scripts) != 1:
            raise SystemExit("FAIL: expected one farm inventory script")
          Path("/tmp/mkulima-inventory.js").write_text("\\n;\\n".join(scripts), encoding="utf-8")
          dashboard = Path("index.html").read_text(encoding="utf-8")
          if 'href="/farm-inventory.html"' not in dashboard and "location.href='/farm-inventory.html'" not in dashboard:
            raise SystemExit("FAIL: dashboard missing farm inventory link")
          print("PASS: farm inventory controls, local-only storage notice, and dashboard link.")
          PY
          node --check /tmp/mkulima-inventory.js

      - name: Validate 72-hour preview, security centre and hosting headers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          app = Path("index.html").read_text(encoding="utf-8")
          required_app = ["MKULIMA DISCOVERY PASS", "72 hours", "function startTrial()", "subscription.html", "server-timed", "security.html"]
          missing = [x for x in required_app if x.lower() not in app.lower()]
          if missing:
            raise SystemExit("FAIL: trial or security link missing: " + ", ".join(missing))
          scripts = re.findall("<script[^>]*>(.*?)</script>", app, flags=re.I | re.S)
          if not scripts:
            raise SystemExit("FAIL: no app scripts found")
          Path("/tmp/mkulima-trial.js").write_text("\n;\n".join(scripts), encoding="utf-8")
          security = Path("security.html").read_text(encoding="utf-8")
          required_security = ["Security & Privacy Centre", "Content Security Policy", "multi-factor authentication", "not yet implemented", "AVENQOR HOLDINGS LTD"]
          missing = [x for x in required_security if x.lower() not in security.lower()]
          if missing:
            raise SystemExit("FAIL: security centre missing: " + ", ".join(missing))
          headers = Path("_headers").read_text(encoding="utf-8")
          for header in ["Content-Security-Policy:", "X-Content-Type-Options: nosniff", "X-Frame-Options: DENY", "Referrer-Policy:", "Permissions-Policy:", "Strict-Transport-Security:"]:
            if header not in headers:
              raise SystemExit("FAIL: missing security header " + header)
          print("PASS: discovery preview disclosure, security centre, and Netlify security headers.")
          PY
          node --check /tmp/mkulima-trial.js

      - name: Validate Kenya crop calendar
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          page = Path("crop-calendar.html").read_text(encoding="utf-8")
          required = ["Kenya crop calendar", "AVENQOR HOLDINGS LTD", "function build()", "localStorage", "Export checklist CSV", "KALRO", "KEPHIS", "maize", "beans", "avocado", "coffee"]
          missing = [item for item in required if item.lower() not in page.lower()]
          if missing:
            raise SystemExit("FAIL: crop calendar missing: " + ", ".join(missing))
          scripts = re.findall(r"<script[^>]*>(.*?)</script>", page, flags=re.I | re.S)
          if not scripts:
            raise SystemExit("FAIL: crop calendar has no script")
          Path("/tmp/mkulima-crop-calendar.js").write_text("\\n;\\n".join(scripts), encoding="utf-8")
          dashboard = Path("index.html").read_text(encoding="utf-8")
          if "/crop-calendar.html" not in dashboard:
            raise SystemExit("FAIL: crop calendar dashboard link missing")
          print("PASS: crop calendar, local saving, export, Kenyan crop set, and dashboard link.")
          PY
          node --check /tmp/mkulima-crop-calendar.js

      - name: Validate secure subscription backend
        shell: bash
        run: |
          set -e
          for file in netlify/functions/*.mjs; do
            node --check "$file"
          done
          python3 - <<'PY'
          from pathlib import Path
          import re
          expected = [
            "netlify/functions/auth-register.mjs",
            "netlify/functions/auth-login.mjs",
            "netlify/functions/subscription-trial.mjs",
            "netlify/functions/subscription-status.mjs",
            "netlify/functions/mpesa-stk-push.mjs",
            "netlify/functions/mpesa-callback.mjs",
            "netlify/functions/_shared.mjs",
            "supabase/mkulima-subscriptions.sql",
            "SUBSCRIPTION_SETUP.md",
            "subscription.html",
          ]
          missing = [p for p in expected if not Path(p).is_file()]
          if missing:
            raise SystemExit("FAIL: missing subscription components: " + ", ".join(missing))
          sql = Path("supabase/mkulima-subscriptions.sql").read_text(encoding="utf-8")
          for term in ["mkulima_trials", "mkulima_payments", "mkulima_subscriptions", "enable row level security", "revoke all"]:
            if term.lower() not in sql.lower():
              raise SystemExit("FAIL: subscription schema missing " + term)
          callback = Path("netlify/functions/mpesa-callback.mjs").read_text(encoding="utf-8")
          for term in ["querySafaricom", "MpesaReceiptNumber", "Number(meta.Amount)", "payment.phone", "status:\"paid\""]:
            if term not in callback:
              raise SystemExit("FAIL: payment verification missing " + term)
          page = Path("subscription.html").read_text(encoding="utf-8")
          for term in ["auth-register", "auth-login", "subscription-trial", "subscription-status", "mpesa-stk-push", "AVENQOR HOLDINGS LTD", "Never enter your M-Pesa PIN"]:
            if term.lower() not in page.lower():
              raise SystemExit("FAIL: subscription centre missing " + term)
          scripts = re.findall(r"<script[^>]*>(.*?)</script>", page, flags=re.I | re.S)
          if not scripts:
            raise SystemExit("FAIL: subscription centre has no client script")
          Path("/tmp/mkulima-subscription.js").write_text("\\n;\\n".join(scripts), encoding="utf-8")
          print("PASS: subscription endpoints, RLS schema, payment verification and account UI.")
          PY
          node --check /tmp/mkulima-subscription.js
